<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Which one worked best? · Talex Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=DM+Sans:wght@400;500&family=EB+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --o:#E85A0C; --o-hover:#c94d08; --bg:#F5F2EC; --surface:#FFFFFF; --txt:#1A1816;
    --muted:#6b6459; --soft:#4a4640; --border:#E2DDD6; --border-strong:#C8C2BA; --amber:#B07D10;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;line-height:1.55}
  .wrap{max-width:1000px;margin:0 auto;padding:2.2rem 1.4rem 5rem}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:1rem;top:1rem;background:var(--surface);padding:.5rem .8rem;z-index:9}
  .top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:2.4rem}
  .brand{display:flex;align-items:center;gap:.6rem;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .brand a{display:inline-flex;align-items:center}
  .topbar-logo{height:28px;width:auto;display:block}
  .topbar-name{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt)}
  .progress{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .eyebrow{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--o);margin:0 0 .6rem}
  h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.3rem,6vw,3.6rem);line-height:1.03;margin:0 0 .9rem;letter-spacing:.01em}
  h1:focus{outline:none}
  h2{font-family:'Oswald',sans-serif;font-size:1.15rem;font-weight:600;margin:1.8rem 0 .5rem}
  .lead{font-family:'EB Garamond',serif;font-style:italic;font-size:1.25rem;color:var(--soft);max-width:60ch;margin:0 0 1.2rem}
  p{margin:0 0 1rem;max-width:68ch}
  .rule{height:2px;background:var(--o);width:64px;margin:1.6rem 0}
  .notice{background:#FCF6EA;border:1px solid #E9D9AE;border-left:4px solid var(--amber);border-radius:8px;padding:.9rem 1.1rem;font-size:.92rem;color:#5b4a1f;margin:0 0 1.4rem;max-width:none}
  .small{font-size:.86rem;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--o);color:#fff;border:0;border-radius:8px;padding:.8rem 1.3rem;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;text-decoration:none}
  .btn:hover{background:var(--o-hover)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--border-strong)}
  .btn.ghost:hover{background:var(--surface)}
  .actions{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin-top:1.6rem}

  /* rank step */
  .instr{display:flex;align-items:center;gap:.8rem;background:var(--txt);color:#fff;border-radius:10px;padding:.9rem 1.1rem;margin:0 0 1rem;font-family:'Oswald',sans-serif;font-size:1.02rem;letter-spacing:.02em}
  .instr .n{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:#F3B08A;line-height:1}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin:0 0 1.2rem}
  .slot{border:1px dashed var(--border-strong);border-radius:10px;padding:.65rem .85rem;min-height:3.6rem;display:flex;flex-direction:column;justify-content:center;gap:.15rem}
  .slot b{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--o);font-weight:600}
  .slot span{font-family:'Oswald',sans-serif;font-size:.95rem;color:var(--muted)}
  .slot.filled{border-style:solid;border-color:var(--txt);background:var(--surface)}
  .slot.filled span{color:var(--txt);font-weight:500}
  button.slot{font:inherit;text-align:left;width:100%;cursor:pointer}
  button.slot:hover,button.slot:focus-visible{border-color:var(--o);outline:none}
  button.slot:hover span,button.slot:focus-visible span{color:var(--o)}
  .instr .sub{display:block;font-family:'DM Sans',sans-serif;font-size:.86rem;letter-spacing:0;color:#D9D3CA;margin-top:.15rem}
  .card.picked{cursor:pointer}
  .card.picked:hover{border-color:var(--o);box-shadow:inset 0 0 0 1px var(--o)}
  .card.picked:focus-visible{outline:3px solid var(--o);outline-offset:2px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:.4rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative;text-align:left}
  .card.pick{cursor:pointer}
  .card.pick:hover{border-color:var(--o)}
  .card.pick:focus-visible{outline:3px solid var(--o);outline-offset:2px}
  .card.picked{border-color:var(--txt);box-shadow:inset 0 0 0 1px var(--txt)}
  .place{position:absolute;top:.7rem;left:.7rem;z-index:2;background:var(--txt);color:#fff;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .6rem;border-radius:999px}
  .video{position:relative;aspect-ratio:16/9;background:#111;display:block;width:100%;border:0;padding:0;cursor:pointer}
  .video img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
  .video .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .video .play span{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
  .video .play svg{width:20px;height:20px;fill:var(--txt);margin-left:3px}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .body{padding:1rem 1.1rem 1.1rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
  .scale{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .name{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;line-height:1.25}
  .spec{font-size:.9rem;color:var(--soft)}
  .spec b{display:block;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:.1rem}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border);margin-top:.3rem}
  .stat{padding:.7rem .2rem .5rem;text-align:center;border-right:1px solid var(--border)}
  .stat:last-child{border-right:0}
  .stat .fig{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;line-height:1;color:var(--o)}
  .stat.measure .fig{color:var(--txt)}
  .stat .cap{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:.25rem}
  .verdict{font-family:'EB Garamond',serif;font-style:italic;font-size:1.3rem;color:var(--txt);margin:1.2rem 0 .4rem}

  /* podium */
  .podium{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:1rem;align-items:end;margin-top:1rem}
  .pcol{display:flex;flex-direction:column;gap:.6rem}
  .phead{display:flex;align-items:baseline;gap:.6rem}
  .pnum{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;line-height:1;color:var(--muted)}
  .p1 .pnum{font-size:4.4rem;color:var(--o)}
  .plabel{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .p1 .plabel{color:var(--o);font-weight:600}
  .p1 .card,.p1 .tile{border-color:var(--o);box-shadow:0 0 0 1px var(--o)}
  .platform{height:16px;background:var(--border-strong);border-radius:4px 4px 0 0}
  .p2 .platform{height:34px;background:var(--muted)}
  .p1 .platform{height:56px;background:var(--o)}
  .chip{display:inline-flex;align-items:center;gap:.4rem;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .7rem;border-radius:999px;border:1px solid var(--border-strong);align-self:flex-start}
  .chip.ok{background:var(--txt);color:#fff;border-color:var(--txt)}
  .chip.no{background:#FFF1E8;color:#9a3d05;border-color:#F3B08A}
  .podium.compact{grid-template-columns:1.15fr 1fr 1fr}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.8rem .95rem;display:flex;flex-direction:column;gap:.35rem}
  .tile .name{font-size:.98rem}
  .tile .fig{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;line-height:1;color:var(--txt)}
  .p1 .tile .fig{color:var(--o);font-size:2rem}
  .tile .cap{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  .opts{display:flex;flex-direction:column;gap:.7rem;margin-top:1rem;max-width:760px}
  .opt{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.1rem;text-align:left;font:inherit;font-size:1rem;color:var(--txt);cursor:pointer;display:flex;gap:.8rem;align-items:flex-start}
  .opt:hover{border-color:var(--o)}
  .opt[aria-pressed="true"]{border-color:var(--o);box-shadow:inset 0 0 0 1px var(--o)}
  .opt .k{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--o);line-height:1.2;min-width:1.2rem}
  .opt .of{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.45rem}
  .opt.win{border-color:var(--o);background:#FFF6F0}
  div.opt{cursor:default}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.3rem 1.4rem;margin-top:1.4rem;max-width:760px}
  .panel .lbl{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--o);margin:0 0 .5rem}
  .panel p:last-child{margin-bottom:0}
  .panel a{color:var(--o)}
  .approval{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-top:.8rem}

  .roundblock{border-top:1px solid var(--border);padding-top:1.4rem;margin-top:1.6rem}
  .roundblock h2{margin-top:0}
  .reason{display:flex;align-items:center;gap:.7rem;margin-top:.9rem;font-size:.95rem}
  .reason b{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}

  .cta{background:var(--txt);color:#fff;border-radius:14px;padding:2rem 1.8rem;margin-top:2.4rem;max-width:760px}
  .cta .eyebrow{color:#F3B08A}
  .cta h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;font-weight:400;margin:0 0 .5rem}
  .cta p{color:#D9D3CA}
  footer{margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--border);font-size:.85rem;color:var(--muted)}
  footer a{color:inherit}

  @media (max-width:820px){
    .grid,.slots,.podium,.podium.compact{grid-template-columns:1fr;align-items:stretch}
    .platform{display:none}
    .p1 .pnum{font-size:3.4rem}
  }
  @media print{.btn,.actions,.video .play,footer{display:none!important}.cta{background:#fff;color:#000;border:1px solid #999}.cta p{color:#000}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <a href="https://www.talexmedia.com" target="_blank" rel="noopener">
        <img class="topbar-logo"
          src="https://static.wixstatic.com/media/3c6878_456d81e9cdb84e6c8bb3260ebfcc0523~mv2.png"
          alt="Talex Media"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'"
        />
        <span class="topbar-name" style="display:none">TALEX MEDIA</span>
      </a>
      <span id="brand" hidden></span>
    </div>
    <div class="progress" id="progress"></div>
  </div>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<script src="content.js"></script>
<script>
(function(){
  'use strict';
  var B = window.BLOCKS, R = window.ROUNDS, C = window.COPY;
  var $ = function(id){ return document.getElementById(id); };
  var main = $('main');

  /* ---------- state ---------- */
  var S = { step:'landing', round:0, ranks:[], display:{}, optOrder:{}, whyPick:null, score:0, log:[] };

  /* ---------- helpers ---------- */
  function fill(t, m){ return t.replace(/\{(\w+)\}/g, function(_, k){ return m[k] !== undefined ? m[k] : '{' + k + '}'; }); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function html(tag, cls, markup){ var e = el(tag, cls); e.innerHTML = markup; return e; }
  function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function num(s){ return parseInt(String(s).replace(/[^\d]/g, ''), 10); }
  function strip(h){ var d = document.createElement('div'); d.innerHTML = h; return d.textContent; }
  /* The series name is the first sentence of the block's own "A company that did it" line. */
  function nameOf(id){
    var v = strip(B[id].spec[2][1]).trim();
    var m = v.match(/^(.*?[.?])(\s|$)/);
    var n = m ? m[1] : v;
    return n.replace(/\.$/, '');
  }
  function measureOf(round, id){ return B[id].stats[round.measureStat]; }
  function trueOrder(round){
    return round.blocks.slice().sort(function(a, b){ return num(measureOf(round, b)[0]) - num(measureOf(round, a)[0]); });
  }
  function ordinal(i){ return C.ordinals[i]; }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function roundLabel(){ return fill(C.roundLabel, { n:S.round + 1, total:R.length }); }
  function focusTitle(){ var h = main.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); try { h.focus({ preventScroll:true }); } catch (e) { h.focus(); } } window.scrollTo(0, 0); }

  /* ---------- video facade ---------- */
  function video(id){
    var b = B[id], w = el('button', 'video'); w.type = 'button';
    w.setAttribute('aria-label', 'Play ' + strip(b.video.label));
    var img = el('img'); img.alt = ''; img.loading = 'lazy';
    img.src = 'https://i.ytimg.com/vi/' + b.video.id + '/hqdefault.jpg';
    var play = html('div', 'play', '<span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>');
    w.appendChild(img); w.appendChild(play);
    w.addEventListener('click', function(ev){
      ev.stopPropagation();
      var f = el('iframe'); f.allow = 'autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen = true;
      f.title = strip(b.video.label);
      f.src = 'https://www.youtube-nocookie.com/embed/' + b.video.id + '?autoplay=1&rel=0';
      w.innerHTML = ''; w.appendChild(f); w.style.cursor = 'default';
    });
    return w;
  }

  /* ---------- one card, every step ---------- */
  function card(round, id, opts){
    var b = B[id];
    var c = el('div', 'card' + (opts.pickable ? ' pick' : '') + (opts.picked ? ' picked' : ''));
    if (opts.pickable) { c.setAttribute('role', 'button'); c.tabIndex = 0; c.setAttribute('aria-pressed', opts.picked ? 'true' : 'false'); }
    if (opts.badge) c.appendChild(el('span', 'place', opts.badge));
    c.appendChild(video(id));
    var body = el('div', 'body');
    body.appendChild(html('div', 'scale', b.scale));
    body.appendChild(el('div', 'name', nameOf(id)));
    var fmt = el('div', 'spec'); fmt.appendChild(el('b', null, b.spec[0][0])); fmt.appendChild(html('span', null, b.spec[0][1])); body.appendChild(fmt);
    var len = el('div', 'spec'); len.appendChild(el('b', null, b.spec[3][0])); len.appendChild(html('span', null, b.spec[3][1])); body.appendChild(len);
    if (opts.stats) {
      var st = el('div', 'stats');
      b.stats.forEach(function(s, i){
        var d = el('div', 'stat' + (i === round.measureStat ? ' measure' : ''));
        d.appendChild(el('div', 'fig', s[0])); d.appendChild(el('div', 'cap', s[1])); st.appendChild(d);
      });
      body.appendChild(st);
    }
    c.appendChild(body);
    return c;
  }

  /* ---------- the "you said" chip ---------- */
  function chip(order, ranks, id){
    var real = order.indexOf(id), said = ranks.indexOf(id), right = real === said;
    return el('span', 'chip ' + (right ? 'ok' : 'no'), right ? fill(C.youSaidRight, { place:ordinal(said) }) : fill(C.youSaidWrong, { place:ordinal(said), real:ordinal(real) }));
  }

  /* ---------- podium: real order, first place biggest, chip on each ---------- */
  function podium(round, order, ranks, compact){
    var w = el('div', 'podium' + (compact ? ' compact' : ''));
    order.forEach(function(id, i){
      var col = el('div', 'pcol p' + (i + 1));
      var head = el('div', 'phead'); head.appendChild(el('span', 'pnum', String(i + 1))); head.appendChild(el('span', 'plabel', cap(ordinal(i)))); col.appendChild(head);
      if (compact) {
        var t = el('div', 'tile'), m = measureOf(round, id);
        t.appendChild(el('div', 'name', nameOf(id)));
        t.appendChild(el('div', 'fig', m[0])); t.appendChild(el('div', 'cap', m[1]));
        col.appendChild(t);
      } else {
        col.appendChild(card(round, id, { stats:true }));
      }
      col.appendChild(chip(order, ranks, id));
      col.appendChild(el('div', 'platform'));
      w.appendChild(col);
    });
    return w;
  }

  /* ---------- screens ---------- */
  function header(eyebrow, title, lead){
    main.appendChild(el('p', 'eyebrow', eyebrow));
    main.appendChild(el('h1', null, title));
    if (lead) main.appendChild(el('p', 'lead', lead));
  }
  function progress(text){ $('progress').textContent = text || ''; }

  function landing(){
    progress('');
    header(C.eyebrow, C.title, C.lead);
    C.intro.forEach(function(t){ main.appendChild(el('p', null, t)); });
    main.appendChild(el('div', 'rule'));
    main.appendChild(el('p', 'notice', C.sample));
    var a = el('div', 'actions'); var b = el('button', 'btn', C.start); b.type = 'button';
    b.addEventListener('click', function(){ go('rank'); }); a.appendChild(b); main.appendChild(a);
  }

  function rank(){
    var r = R[S.round];
    if (!S.display[S.round]) S.display[S.round] = shuffle(r.blocks);
    progress(roundLabel() + ' · ' + C.rankStep);
    header(roundLabel() + ' · ' + C.rankStep, r.job, fill(C.rankLead, { measure:r.measure }));
    var unpick = function(id){ var k = S.ranks.indexOf(id); if (k !== -1) { S.ranks.splice(k, 1); render(); } };
    var onKey = function(fn){ return function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }; };
    var ins = el('div', 'instr');
    ins.appendChild(el('span', 'n', String(S.ranks.length + 1 > 3 ? 3 : S.ranks.length + 1)));
    var insText = el('span'); insText.appendChild(document.createTextNode(C.rankInstruction));
    if (S.ranks.length) insText.appendChild(el('span', 'sub', C.rankUndo));
    ins.appendChild(insText); main.appendChild(ins);
    var slots = el('div', 'slots');
    for (var i = 0; i < 3; i++) {
      var filled = !!S.ranks[i];
      var s = el(filled ? 'button' : 'div', 'slot' + (filled ? ' filled' : ''));
      if (filled) { s.type = 'button'; s.setAttribute('aria-label', fill(C.slotRemove, { name:nameOf(S.ranks[i]), place:ordinal(i) })); s.addEventListener('click', (function(id){ return function(){ unpick(id); }; })(S.ranks[i])); }
      s.appendChild(el('b', null, cap(ordinal(i))));
      s.appendChild(el('span', null, filled ? nameOf(S.ranks[i]) : C.slotEmpty));
      slots.appendChild(s);
    }
    main.appendChild(slots);
    var g = el('div', 'grid');
    S.display[S.round].forEach(function(id){
      var pos = S.ranks.indexOf(id);
      var c = card(r, id, { pickable:pos === -1, picked:pos !== -1, badge:pos === -1 ? null : cap(ordinal(pos)) });
      if (pos === -1) {
        var choose = function(){ if (S.ranks.length < 3 && S.ranks.indexOf(id) === -1) { S.ranks.push(id); render(); } };
        c.addEventListener('click', choose);
        c.addEventListener('keydown', onKey(choose));
      } else {
        c.setAttribute('role', 'button'); c.tabIndex = 0; c.setAttribute('aria-pressed', 'true');
        c.setAttribute('aria-label', fill(C.slotRemove, { name:nameOf(id), place:ordinal(pos) }));
        var drop = function(){ unpick(id); };
        c.addEventListener('click', drop);
        c.addEventListener('keydown', onKey(drop));
      }
      g.appendChild(c);
    });
    main.appendChild(g);
    main.appendChild(el('p', 'small', C.measureNote)).style.marginTop = '1rem';
    var a = el('div', 'actions');
    var lock = el('button', 'btn', C.lock); lock.type = 'button'; lock.disabled = S.ranks.length < 3;
    lock.addEventListener('click', function(){ if (S.ranks.length === 3) go('reveal'); });
    var reset = el('button', 'btn ghost', C.reset); reset.type = 'button';
    reset.addEventListener('click', function(){ S.ranks = []; render(); });
    a.appendChild(lock); a.appendChild(reset); main.appendChild(a);
  }

  function reveal(){
    var r = R[S.round], order = trueOrder(r), winner = order[0];
    var got = S.ranks[0] === winner;
    if (S.log.length === S.round) { S.log.push({ round:S.round, winner:winner, gotWinner:got, gotWhy:null, ranks:S.ranks.slice() }); if (got) S.score += 1; }
    progress(roundLabel() + ' · ' + C.revealStep);
    header(roundLabel() + ' · ' + C.revealStep, r.job, null);
    var pickPlace = order.indexOf(S.ranks[0]);
    main.appendChild(el('p', 'verdict', got ? C.calledWinner : fill(C.missedWinner, { pick:nameOf(S.ranks[0]), place:ordinal(pickPlace) })));
    main.appendChild(podium(r, order, S.ranks, false));
    main.appendChild(el('p', 'small', C.measureNote)).style.marginTop = '1rem';
    var a = el('div', 'actions'); var b = el('button', 'btn', C.whyStep); b.type = 'button';
    b.addEventListener('click', function(){ go('why'); }); a.appendChild(b); main.appendChild(a);
  }

  function why(){
    var r = R[S.round], winner = trueOrder(r)[0];
    if (!S.optOrder[S.round]) S.optOrder[S.round] = shuffle(r.why.options.map(function(_, i){ return i; }));
    progress(roundLabel() + ' · ' + C.whyStep);
    header(roundLabel() + ' · ' + C.whyStep, r.why.question, fill(C.whyLead, { winner:nameOf(winner) }));
    var o = el('div', 'opts');
    S.optOrder[S.round].forEach(function(idx, k){
      var opt = r.why.options[idx];
      var b = el('button', 'opt'); b.type = 'button'; b.setAttribute('aria-pressed', S.whyPick === idx ? 'true' : 'false');
      b.appendChild(el('span', 'k', String.fromCharCode(65 + k)));
      b.appendChild(el('span', null, opt.text));
      b.addEventListener('click', function(){ S.whyPick = (S.whyPick === idx) ? null : idx; render(); });
      o.appendChild(b);
    });
    main.appendChild(o);
    var a = el('div', 'actions'); var lock = el('button', 'btn', C.choose); lock.type = 'button'; lock.disabled = S.whyPick === null;
    lock.addEventListener('click', function(){ if (S.whyPick !== null) go('whyreveal'); }); a.appendChild(lock); main.appendChild(a);
  }

  function whyreveal(){
    var r = R[S.round], order = trueOrder(r), winner = order[0], pick = r.why.options[S.whyPick], right = pick.block === winner;
    if (S.log[S.round].gotWhy === null) { S.log[S.round].gotWhy = right; S.log[S.round].whyPick = S.whyPick; if (right) S.score += 1; }
    progress(roundLabel() + ' · ' + C.whyRevealStep);
    header(roundLabel() + ' · ' + C.whyRevealStep, r.job, null);
    main.appendChild(el('p', 'verdict', right ? fill(C.whyRight, { winner:nameOf(winner) }) : fill(C.whyWrong, { other:nameOf(pick.block), winner:nameOf(winner) })));
    main.appendChild(el('h2', null, C.realOrder));
    main.appendChild(podium(r, order, S.ranks, true));
    main.appendChild(el('h2', null, r.why.question));
    var o = el('div', 'opts');
    S.optOrder[S.round].forEach(function(idx, k){
      var opt = r.why.options[idx], isWin = opt.block === winner, mine = idx === S.whyPick;
      var b = el('div', 'opt' + (isWin ? ' win' : ''));
      b.appendChild(el('span', 'k', String.fromCharCode(65 + k)));
      var t = el('span'); t.appendChild(document.createTextNode(opt.text));
      var of = el('span', 'of');
      of.appendChild(el('span', 'chip', fill(C.optionTrueOf, { name:nameOf(opt.block) })));
      if (isWin) of.appendChild(el('span', 'chip ok', C.winnerFact));
      if (mine) of.appendChild(el('span', 'chip ' + (right ? 'ok' : 'no'), C.yourAnswer));
      t.appendChild(of); b.appendChild(t); o.appendChild(b);
    });
    main.appendChild(o);
    var src = el('div', 'panel'); src.appendChild(el('p', 'lbl', C.sourceLabel));
    src.appendChild(html('p', null, B[winner].note)); main.appendChild(src);
    var tk = el('div', 'panel'); tk.appendChild(el('p', 'lbl', C.takeawayLabel));
    tk.appendChild(el('p', null, r.takeaway)); tk.appendChild(el('div', 'approval', C.approval)); main.appendChild(tk);
    var a = el('div', 'actions'); var last = S.round === R.length - 1;
    var b = el('button', 'btn', last ? C.seeResult : fill(C.nextRound, { n:S.round + 2 })); b.type = 'button';
    b.addEventListener('click', function(){ if (last) { go('result'); } else { S.round += 1; S.ranks = []; S.whyPick = null; go('rank'); } });
    a.appendChild(b); main.appendChild(a);
  }

  function result(){
    progress(C.resultStep);
    header(C.resultStep, fill(C.resultHeading, { n:S.score }), C.resultSub);
    main.appendChild(el('p', 'verdict', S.score >= C.highFrom ? C.resultHigh : C.resultLow));
    S.log.forEach(function(L){
      var r = R[L.round], order = trueOrder(r);
      var blk = el('div', 'roundblock');
      blk.appendChild(el('p', 'eyebrow', fill(C.roundLabel, { n:L.round + 1, total:R.length })));
      blk.appendChild(el('h2', null, r.job));
      blk.appendChild(podium(r, order, L.ranks, true));
      var re = el('div', 'reason'); re.appendChild(el('b', null, C.reasonRow + ':'));
      re.appendChild(el('span', 'chip ' + (L.gotWhy ? 'ok' : 'no'), L.gotWhy ? C.logRight : C.logMissed));
      re.appendChild(el('span', null, r.why.options.filter(function(o){ return o.block === L.winner; })[0].text));
      blk.appendChild(re);
      main.appendChild(blk);
    });
    var cta = el('div', 'cta');
    cta.appendChild(el('p', 'eyebrow', C.brand));
    cta.appendChild(el('h2', null, C.cta.heading));
    cta.appendChild(el('p', null, C.cta.copy));
    /* Booking destination is configuration. Confirm the live link before release. */
    var a = el('a', 'btn', C.cta.button); a.href = C.cta.url; a.target = '_blank'; a.rel = 'noopener'; cta.appendChild(a);
    main.appendChild(cta);
    var acts = el('div', 'actions');
    var share = el('button', 'btn ghost', C.share); share.type = 'button';
    share.addEventListener('click', function(){
      var url = location.href.split('#')[0];
      var done = function(){ share.textContent = C.shared; setTimeout(function(){ share.textContent = C.share; }, 1800); };
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(done, function(){ window.prompt(C.share, url); }); } else { window.prompt(C.share, url); }
    });
    var print = el('button', 'btn ghost', C.print); print.type = 'button'; print.addEventListener('click', function(){ window.print(); });
    var over = el('button', 'btn ghost', C.startOver); over.type = 'button';
    over.addEventListener('click', function(){ S = { step:'landing', round:0, ranks:[], display:{}, optOrder:{}, whyPick:null, score:0, log:[] }; go('landing'); });
    acts.appendChild(share); acts.appendChild(print); acts.appendChild(over); main.appendChild(acts);
  }

  /* ---------- router ---------- */
  var screens = { landing:landing, rank:rank, reveal:reveal, why:why, whyreveal:whyreveal, result:result };
  function render(){ main.innerHTML = ''; screens[S.step](); }
  function go(step){ S.step = step; render(); focusTitle(); }

  $('brand').textContent = C.brand;
  $('foot').innerHTML = C.brand + ' · <a href="https://talexmedia.com">talexmedia.com</a> · <a href="mailto:solutions@talexmedia.com">solutions@talexmedia.com</a>';
  render();

  /* read-only hook so the arithmetic can be checked from the console */
  window.__caseStudy = { state:function(){ return JSON.parse(JSON.stringify(S)); }, order:function(i){ return trueOrder(R[i]); }, nameOf:nameOf, go:go };
})();
</script>
</body>
</html>
