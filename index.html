<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Which one worked best? · Talex Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=DM+Sans:wght@400;500&family=EB+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --o:#E85A0C; --o-hover:#c94d08; --bg:#F5F2EC; --surface:#FFFFFF; --txt:#1A1816;
    --muted:#6b6459; --soft:#4a4640; --border:#E2DDD6; --border-strong:#C8C2BA; --amber:#B07D10;
    --ease:cubic-bezier(.2,.7,.2,1);
    --shadow-sm:0 1px 2px rgba(26,24,22,.05),0 6px 20px rgba(26,24,22,.06);
    --shadow-md:0 2px 4px rgba(26,24,22,.06),0 18px 44px rgba(26,24,22,.12);
    --glow:0 8px 22px rgba(232,90,12,.32);
    --r:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;overflow-x:clip}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:1.6rem 1.4rem 5rem}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:1rem;top:1rem;background:var(--surface);padding:.5rem .8rem;z-index:9}

  /* topbar + progress, frosted and sticky */
  .head{position:sticky;top:0;z-index:20;margin:0 -1.4rem 2.4rem;padding:0 1.4rem;background:rgba(245,242,236,.78);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0 .8rem}
  .brand a{display:inline-flex;align-items:center}
  .topbar-logo{height:28px;width:auto;display:block}
  .topbar-name{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt)}
  .progress{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  /* game hud */
  .hud{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
  .pill{display:inline-flex;align-items:center;gap:.45rem;border-radius:999px;padding:.35rem .75rem .35rem .4rem;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);color:var(--muted)}
  .pill b{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 .4rem;border-radius:999px;background:var(--txt);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:1.05rem;font-weight:400;font-variant-numeric:tabular-nums}
  .pill.score b{background:var(--o);box-shadow:var(--glow)}
  .pill.bump b{animation:pop .5s var(--ease)}
  .pill[hidden]{display:none}
  .plus{position:fixed;z-index:30;font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--o);pointer-events:none;animation:floatup 1.1s var(--ease) both;text-shadow:0 2px 10px rgba(232,90,12,.35)}
  @keyframes floatup{0%{opacity:0;transform:translateY(6px) scale(.8)}20%{opacity:1;transform:translateY(-4px) scale(1.1)}100%{opacity:0;transform:translateY(-42px) scale(1)}}
  .tier{display:inline-flex;align-items:center;gap:.5rem;border-radius:999px;padding:.5rem 1rem .5rem .55rem;background:var(--txt);color:#fff;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:.2rem 0 1rem;box-shadow:var(--shadow-md)}
  .tier .medal{width:26px;height:34px}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
  /* medals */
  .medal{display:inline-block;width:40px;height:52px;vertical-align:middle;filter:drop-shadow(0 4px 10px rgba(26,24,22,.22))}
  .medal .ribbon{fill:var(--txt)}
  .medal.gold .disc{fill:#E3B341}.medal.gold .rim{stroke:#B8860B}
  .medal.silver .disc{fill:#D6D6D6}.medal.silver .rim{stroke:#9A9A9A}
  .medal.bronze .disc{fill:#D08A4A}.medal.bronze .rim{stroke:#8C5A2B}
  .medal .hi{fill:rgba(255,255,255,.45)}
  .medal .n{font-family:'Bebas Neue',sans-serif;font-size:15px;fill:var(--txt);text-anchor:middle;dominant-baseline:central}
  .bar{height:3px;background:var(--border);border-radius:999px;overflow:hidden;margin-bottom:0}
  .bar span{display:block;height:100%;width:0;background:var(--o);border-radius:999px;transition:width .6s var(--ease)}

  /* type */
  .eyebrow{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--o);margin:0 0 .6rem}
  h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.4rem,6vw,3.8rem);line-height:1.02;margin:0 0 .9rem;letter-spacing:.01em}
  h1:focus{outline:none}
  h2{font-family:'Oswald',sans-serif;font-size:1.15rem;font-weight:600;margin:1.9rem 0 .6rem}
  .lead{font-family:'EB Garamond',serif;font-style:italic;font-size:1.3rem;color:var(--soft);max-width:60ch;margin:0 0 1.2rem}
  p{margin:0 0 1rem;max-width:68ch}
  .rule{height:2px;background:var(--o);width:64px;margin:1.6rem 0;border-radius:2px}
  .notice{background:#FCF6EA;border:1px solid #EFE2BE;border-left:4px solid var(--amber);border-radius:12px;padding:.9rem 1.1rem;font-size:.92rem;color:#5b4a1f;margin:0 0 1.4rem;max-width:none}
  .small{font-size:.86rem;color:var(--muted)}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--o);color:#fff;border:0;border-radius:999px;padding:.85rem 1.5rem;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;text-decoration:none;box-shadow:var(--glow);transition:transform .15s var(--ease),background .2s,box-shadow .25s var(--ease),opacity .2s}
  .btn:hover{background:var(--o-hover);transform:translateY(-1px);box-shadow:0 12px 28px rgba(232,90,12,.36)}
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--border-strong);box-shadow:none}
  .btn.ghost:hover{background:var(--surface);box-shadow:var(--shadow-sm)}
  .btn:focus-visible{outline:3px solid rgba(232,90,12,.45);outline-offset:3px}
  .actions{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin-top:1.8rem}

  /* the numeral, used everywhere a place is shown */
  .num{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1.3rem;line-height:1;background:var(--o);color:#fff;box-shadow:var(--glow);flex:none;transition:background .2s,box-shadow .2s,transform .2s var(--ease)}
  .num.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1.5px dashed var(--border-strong)}

  /* rank step */
  .instr{display:flex;align-items:center;gap:.9rem;background:var(--txt);color:#fff;border-radius:14px;padding:.9rem 1.1rem;margin:0 0 1rem;font-family:'Oswald',sans-serif;font-size:1.05rem;letter-spacing:.02em;box-shadow:var(--shadow-sm)}
  .instr .num{background:#fff;color:var(--txt);box-shadow:none}
  .instr .sub{display:block;font-family:'DM Sans',sans-serif;font-size:.86rem;letter-spacing:0;color:#CFC8BE;margin-top:.15rem}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin:0 0 1.2rem}
  .slot{border:1.5px dashed var(--border-strong);border-radius:14px;padding:.6rem .8rem;min-height:3.9rem;display:flex;align-items:center;gap:.75rem;background:transparent;transition:border-color .2s,background .25s,box-shadow .25s var(--ease),transform .2s var(--ease)}
  .slot .t{display:flex;flex-direction:column;gap:.1rem;min-width:0}
  .slot b{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .slot span{font-family:'Oswald',sans-serif;font-size:.95rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot.filled{border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-sm)}
  .slot.filled b{color:var(--o)}
  .slot.filled span{color:var(--txt);font-weight:500}
  button.slot{font:inherit;text-align:left;width:100%;cursor:pointer}
  button.slot:hover,button.slot:focus-visible{border-color:var(--o);box-shadow:var(--shadow-md);transform:translateY(-2px);outline:none}
  button.slot:hover span,button.slot:focus-visible span{color:var(--o)}

  /* cards */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;margin-top:.4rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative;text-align:left;box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .2s}
  .card.pick,.card.picked{cursor:pointer}
  .card.pick:hover,.card.picked:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);border-color:var(--o)}
  .card.pick:focus-visible,.card.picked:focus-visible{outline:3px solid rgba(232,90,12,.45);outline-offset:3px}
  .card.picked{border-color:var(--o);box-shadow:0 0 0 1.5px var(--o),var(--shadow-sm)}
  .place{position:absolute;top:.8rem;left:.8rem;z-index:2;width:46px;height:46px;font-size:1.55rem;box-shadow:0 0 0 3px #fff,var(--glow)}
  .video{position:relative;aspect-ratio:16/9;background:#111;display:block;width:100%;border:0;padding:0;cursor:pointer;overflow:hidden}
  .video img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease)}
  .card:hover .video img{transform:scale(1.04)}
  .video::after{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(to top,rgba(0,0,0,.38),transparent);pointer-events:none}
  .video.playing::after{display:none}
  .video .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .video .play span{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.28);transition:transform .25s var(--ease),background .2s}
  .video:hover .play span{transform:scale(1.08);background:rgba(255,255,255,.9)}
  .video .play svg{width:20px;height:20px;fill:var(--txt);margin-left:3px}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .body{padding:1.05rem 1.15rem 1.15rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
  .scale{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .name{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;line-height:1.25}
  .spec{font-size:.9rem;color:var(--soft)}
  .spec b{display:block;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:.1rem}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border);margin-top:.3rem}
  .stat{padding:.75rem .2rem .55rem;text-align:center;border-right:1px solid var(--border)}
  .stat:last-child{border-right:0}
  .stat .fig{font-family:'Bebas Neue',sans-serif;font-size:1.45rem;line-height:1;color:var(--o);font-variant-numeric:tabular-nums}
  .stat.measure .fig{color:var(--txt);font-size:1.7rem}
  .stat .cap{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:.3rem}
  .verdict{font-family:'EB Garamond',serif;font-style:italic;font-size:1.35rem;color:var(--txt);margin:1.2rem 0 .4rem}

  /* podium: shared rows, so every card takes the same top and bottom edge and only the step height varies */
  .podium{display:grid;grid-template-columns:1.3fr 1fr 1fr;grid-template-rows:auto auto 1fr auto;column-gap:1.1rem;align-items:stretch;margin-top:1rem}
  .pcol{display:contents}
  .p1 > *{grid-column:1}.p2 > *{grid-column:2}.p3 > *{grid-column:3}
  .podium .cmp{grid-row:1;margin-bottom:.8rem}
  .podium .phead{grid-row:2;display:none}
  .podium .card,.podium .tile{grid-row:3;position:relative;z-index:1;margin-bottom:.8rem}
  .podium .spot{grid-row:3;position:relative;z-index:0;margin:-14% -8% -10%;border-radius:36px;background:radial-gradient(60% 55% at 50% 45%,rgba(232,90,12,.24),rgba(232,90,12,0) 70%);pointer-events:none;opacity:0}
  .podium .platform{grid-row:4;align-self:end}
  .pnum{width:44px;height:44px;font-size:1.5rem;background:var(--txt);box-shadow:var(--shadow-sm)}
  .p1 .pnum{width:56px;height:56px;font-size:2rem;background:var(--o);box-shadow:var(--glow)}
  .plabel{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .p1 .plabel{color:var(--o);font-weight:600;font-size:12px}
  .p1 .card,.p1 .tile{border-color:var(--o);box-shadow:0 0 0 1.5px var(--o),var(--shadow-md)}
  /* the step carries its own number and label */
  .platform{height:40px;background:var(--border-strong);border-radius:10px 10px 0 0;transform-origin:bottom;display:flex;align-items:center;justify-content:center;gap:.6rem;color:#fff;overflow:hidden}
  .p2 .platform{height:60px;background:var(--muted)}
  .p1 .platform{height:88px;background:var(--o);box-shadow:var(--glow)}
  .pf-num{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;line-height:1}
  .p2 .pf-num{font-size:2.2rem}
  .p1 .pf-num{font-size:3.2rem}
  .platform .medal{width:30px;height:39px;filter:none}
  .p2 .platform .medal{width:38px;height:50px}
  .p1 .platform .medal{width:50px;height:65px}
  .cmp-side .medal{width:34px;height:44px}
  .phead .medal{width:36px;height:47px}
  .p1 .phead .medal{width:44px;height:57px}
  .pf-lbl{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
  .p1 .pf-lbl{font-size:13px;font-weight:600}
  /* you said versus real */
  .cmp{display:flex;align-items:flex-end;gap:.6rem;flex-wrap:wrap}
  .cmp-side{display:flex;flex-direction:column;align-items:center;gap:.3rem}
  .cmp-lbl{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .cmp .num{width:40px;height:40px;font-size:1.35rem}
  .cmp .num.ghost{color:#9a3d05;border-color:#F3B08A;background:#FFF1E8}
  .cmp-arrow{display:inline-flex;align-items:center;height:40px;color:var(--border-strong)}
  .cmp-arrow svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .cmp.ok .cmp-arrow{color:var(--txt)}
  .cmp-verdict{display:inline-flex;align-items:center;gap:.4rem;height:40px;padding:0 .8rem;border-radius:999px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-left:.2rem}
  .cmp-verdict svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .cmp.ok .cmp-verdict{background:var(--txt);color:#fff}
  .cmp.no .cmp-verdict{background:#FFF1E8;color:#9a3d05;border:1px solid #F3B08A}
  .chip{display:inline-flex;align-items:center;gap:.4rem;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:.45rem .8rem;border-radius:999px;border:1px solid var(--border-strong);align-self:flex-start;background:var(--surface)}
  .chip.ok{background:var(--txt);color:#fff;border-color:var(--txt)}
  .chip.no{background:#FFF1E8;color:#9a3d05;border-color:#F3B08A}
  .podium.compact{grid-template-columns:1.15fr 1fr 1fr}
  .podium.compact .cmp .num{width:32px;height:32px;font-size:1.1rem}
  .podium.compact .cmp-arrow,.podium.compact .cmp-verdict{height:32px}
  .podium.compact .platform{height:26px}.podium.compact .p2 .platform{height:38px}.podium.compact .p1 .platform{height:52px;box-shadow:none}
  .podium.compact .pf-num{font-size:1.2rem}.podium.compact .p2 .pf-num{font-size:1.4rem}.podium.compact .p1 .pf-num{font-size:1.9rem}
  .podium.compact .pf-lbl{font-size:9px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.35rem;box-shadow:var(--shadow-sm)}
  .tile .name{font-size:.98rem}
  .tile .fig{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;line-height:1;color:var(--txt);font-variant-numeric:tabular-nums}
  .p1 .tile .fig{color:var(--o);font-size:2.1rem}
  .tile .cap{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  /* why */
  .opts{display:flex;flex-direction:column;gap:.75rem;margin-top:1rem;max-width:760px}
  .opt{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.15rem;text-align:left;font:inherit;font-size:1rem;color:var(--txt);cursor:pointer;display:flex;gap:.9rem;align-items:flex-start;box-shadow:var(--shadow-sm);transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s,background .2s}
  .opt:hover{border-color:var(--o);transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .opt[aria-pressed="true"]{border-color:var(--o);box-shadow:0 0 0 1.5px var(--o),var(--shadow-sm)}
  .opt .k{width:30px;height:30px;font-size:1.05rem;background:var(--bg);color:var(--txt);box-shadow:none;border:1px solid var(--border)}
  .opt[aria-pressed="true"] .k,.opt.win .k{background:var(--o);color:#fff;border-color:var(--o)}
  .opt .of{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
  .opt.win{border-color:var(--o);background:#FFF8F3}
  div.opt{cursor:default}
  div.opt:hover{transform:none;box-shadow:var(--shadow-sm)}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.3rem 1.4rem;margin-top:1.4rem;max-width:760px;box-shadow:var(--shadow-sm)}
  .panel .lbl{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--o);margin:0 0 .5rem}
  .panel p:last-child{margin-bottom:0}
  .panel a{color:var(--o)}
  .approval{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-top:.8rem}

  .roundblock{border-top:1px solid var(--border);padding-top:1.4rem;margin-top:1.8rem}
  .roundblock h2{margin-top:0}
  .reason{display:flex;align-items:center;gap:.7rem;margin-top:.9rem;font-size:.95rem;flex-wrap:wrap}
  .reason b{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .count{font-variant-numeric:tabular-nums}

  .cta{position:relative;overflow:hidden;background:var(--txt);color:#fff;border-radius:20px;padding:2.2rem 2rem;margin-top:2.6rem;max-width:760px;box-shadow:var(--shadow-md)}
  .cta::before{content:'';position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(232,90,12,.45),transparent);top:-220px;left:-140px;pointer-events:none}
  .cta > *{position:relative}
  .cta .eyebrow{color:#F3B08A}
  .cta h2{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;font-weight:400;margin:0 0 .5rem}
  .cta p{color:#D9D3CA}
  footer{margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--border);font-size:.85rem;color:var(--muted)}
  footer a{color:inherit}

  /* motion */
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.5);opacity:0}65%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,90,12,.45),0 0 0 1.5px var(--o),var(--shadow-md)}100%{box-shadow:0 0 0 22px rgba(232,90,12,0),0 0 0 1.5px var(--o),var(--shadow-md)}}
  main.anim > *{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
  main.anim .grid > .card{animation:rise .65s var(--ease) both;animation-delay:calc(var(--i,0) * 90ms + 180ms)}

<script src="content.js?v=eea0daedaf"></script>
<script>
(function(){
  'use strict';
  var B = window.BLOCKS, R = window.ROUNDS, C = window.COPY;
  var $ = function(id){ return document.getElementById(id); };
  var main = $('main');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- state ---------- */
  var S = { step:'landing', round:0, ranks:[], display:{}, optOrder:{}, whyPick:null, score:0, streak:0, log:[] };
  var STEPS = ['rank', 'reveal', 'why', 'whyreveal'];

  /* ---------- the game layer: points, streak, tier, confetti ---------- */
  function hud(){
    $('hudScoreN').textContent = S.score; $('hudScoreLbl').textContent = C.scoreLabel;
    $('hudStreakN').textContent = S.streak; $('hudStreakLbl').textContent = C.streakLabel;
    $('hudStreak').hidden = S.streak < 2;
  }
  function award(){
    S.score += 1; S.streak += 1; hud();
    var pill = $('hudScore'); pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
    if (reduced || document.hidden) return;
    var r = pill.getBoundingClientRect(), p = el('div', 'plus', C.plusOne);
    p.style.left = (r.left + r.width / 2 - 12) + 'px'; p.style.top = (r.top - 6) + 'px';
    document.body.appendChild(p); setTimeout(function(){ if (p.parentNode) p.parentNode.removeChild(p); }, 1200);
  }
  function miss(){ S.streak = 0; hud(); }
  function tierOf(n){ return C.tiers.slice().sort(function(a, b){ return b.from - a.from; }).filter(function(t){ return n >= t.from; })[0]; }
  function confetti(){
    if (reduced || document.hidden) return;
    var c = el('canvas'); c.id = 'confetti'; document.body.appendChild(c);
    var W = c.width = window.innerWidth, H = c.height = window.innerHeight, ctx = c.getContext('2d');
    var colors = ['#E85A0C', '#1A1816', '#E3B341', '#F5F2EC', '#B07D10', '#D6D6D6'], ps = [];
    for (var i = 0; i < 110; i++) ps.push({ x:W / 2 + (Math.random() - .5) * W * .5, y:H * .35, vx:(Math.random() - .5) * 14, vy:-Math.random() * 14 - 4, r:Math.random() * 5 + 3, c:colors[i % colors.length], a:Math.random() * Math.PI, va:(Math.random() - .5) * .3 });
    var t0 = null;
    function frame(t){
      if (t0 === null) t0 = t; var k = (t - t0) / 1500; ctx.clearRect(0, 0, W, H);
      ps.forEach(function(p){ p.vy += .35; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = Math.max(0, 1 - k); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); });
      if (k < 1) requestAnimationFrame(frame); else if (c.parentNode) c.parentNode.removeChild(c);
    }
    requestAnimationFrame(frame);
    setTimeout(function(){ if (c.parentNode) c.parentNode.removeChild(c); }, 2400);
  }

  /* ---------- helpers ---------- */
  /* A missing copy key renders empty rather than stopping the page. */
  function fill(t, m){ return String(t || '').replace(/\{(\w+)\}/g, function(_, k){ return m[k] !== undefined ? m[k] : '{' + k + '}'; }); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function html(tag, cls, markup){ var e = el(tag, cls); e.innerHTML = markup; return e; }
  function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function num(s){ return parseInt(String(s).replace(/[^\d]/g, ''), 10); }
  function strip(h){ var d = document.createElement('div'); d.innerHTML = h; return d.textContent; }
  /* The series name is the first sentence of the block's own "A company that did it" line. */
  function nameOf(id){
    var v = strip(B[id].spec[2][1]).trim();
    var m = v.match(/^(.*?[.?])(\s|$)/);
    var n = m ? m[1] : v;
    return n.replace(/\.$/, '');
  }
  function measureOf(round, id){ return B[id].stats[round.measureStat]; }
  function trueOrder(round){
    return round.blocks.slice().sort(function(a, b){ return num(measureOf(round, b)[0]) - num(measureOf(round, a)[0]); });
  }
  function ordinal(i){ return C.ordinals[i]; }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function roundLabel(){ return fill(C.roundLabel, { n:S.round + 1, total:R.length }); }
  function numeral(n, cls){ return el('span', 'num' + (cls ? ' ' + cls : ''), String(n)); }
  /* Gold, silver, bronze: a disc on a ribbon with the place inside. Inline SVG, no ids, so it can repeat on a page. */
  function medal(place){
    var kind = ['gold', 'silver', 'bronze'][place];
    var s = html('span', 'medal ' + kind,
      '<svg viewBox="0 0 40 52" aria-hidden="true">' +
      '<polygon class="ribbon" points="9,0 18,0 24,18 15,18"/>' +
      '<polygon class="ribbon" points="22,0 31,0 25,18 16,18"/>' +
      '<circle class="disc" cx="20" cy="34" r="15"/>' +
      '<circle class="rim" cx="20" cy="34" r="11.5" fill="none" stroke-width="1.6"/>' +
      '<ellipse class="hi" cx="15" cy="28" rx="5" ry="3"/>' +
      '<text class="n" x="20" y="34.5">' + (place + 1) + '</text>' +
      '</svg>');
    s.setAttribute('role', 'img'); s.setAttribute('aria-label', C.medalNames[place]);
    return s;
  }
  function focusTitle(){ var h = main.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); try { h.focus({ preventScroll:true }); } catch (e) { h.focus(); } } window.scrollTo(0, 0); }
  function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  /* Counts a plain number up from zero. Text figures (B2B, 1m17s, $50) stay as they are. */
  function countUp(node, delay){
    var final = node.textContent;
    if (reduced || document.hidden || !/^[\d,]+$/.test(final)) return;
    var target = num(final), dur = 1000, t0 = null, done = false;
    node.textContent = '0';
    setTimeout(function(){
      function tick(t){ if (done) return; if (t0 === null) t0 = t; var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); node.textContent = fmt(Math.round(target * e)); if (p < 1) requestAnimationFrame(tick); else { done = true; node.textContent = final; } }
      requestAnimationFrame(tick);
    }, delay || 0);
    /* Frame callbacks pause in a background tab. The final figure lands regardless. */
    setTimeout(function(){ if (!done) { done = true; node.textContent = final; } }, (delay || 0) + dur + 250);
  }

  /* ---------- video facade ---------- */
  function video(id){
    var b = B[id], w = el('button', 'video'); w.type = 'button';
    w.setAttribute('aria-label', 'Play ' + strip(b.video.label));
    var img = el('img'); img.alt = ''; img.loading = 'lazy';
    img.src = 'https://i.ytimg.com/vi/' + b.video.id + '/hqdefault.jpg';
    var play = html('div', 'play', '<span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>');
    w.appendChild(img); w.appendChild(play);
    w.addEventListener('click', function(ev){
      ev.stopPropagation();
      var f = el('iframe'); f.allow = 'autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen = true;
      f.title = strip(b.video.label);
      f.src = 'https://www.youtube-nocookie.com/embed/' + b.video.id + '?autoplay=1&rel=0';
      w.innerHTML = ''; w.appendChild(f); w.classList.add('playing'); w.style.cursor = 'default';
    });
    return w;
  }

  /* ---------- one card, every step ---------- */
  function card(round, id, opts){
    var b = B[id];
    var c = el('div', 'card' + (opts.pickable ? ' pick' : '') + (opts.picked ? ' picked' : ''));
    if (opts.pickable) { c.setAttribute('role', 'button'); c.tabIndex = 0; c.setAttribute('aria-pressed', opts.picked ? 'true' : 'false'); }
    if (opts.place !== undefined) c.appendChild(numeral(opts.place + 1, 'place' + (opts.fresh ? ' fresh' : '')));
    c.appendChild(video(id));
    var body = el('div', 'body');
    body.appendChild(html('div', 'scale', b.scale));
    body.appendChild(el('div', 'name', nameOf(id)));
    var fmtRow = el('div', 'spec'); fmtRow.appendChild(el('b', null, b.spec[0][0])); fmtRow.appendChild(html('span', null, b.spec[0][1])); body.appendChild(fmtRow);
    var len = el('div', 'spec'); len.appendChild(el('b', null, b.spec[3][0])); len.appendChild(html('span', null, b.spec[3][1])); body.appendChild(len);
    if (opts.stats) {
      var st = el('div', 'stats');
      b.stats.forEach(function(s, i){
        var d = el('div', 'stat' + (i === round.measureStat ? ' measure' : ''));
        d.appendChild(el('div', 'fig', s[0])); d.appendChild(el('div', 'cap', s[1])); st.appendChild(d);
      });
      body.appendChild(st);
    }
    c.appendChild(body);
    return c;
  }

  /* ---------- "you said" versus "real": two numerals and an arrow ---------- */
  var ICON_OK = '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';
  var ICON_NO = '<svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  var ICON_ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="13 5 20 12 13 19"/></svg>';
  function chip(order, ranks, id){
    var real = order.indexOf(id), said = ranks.indexOf(id), right = real === said;
    var w = el('div', 'cmp ' + (right ? 'ok' : 'no'));
    w.setAttribute('role', 'img');
    w.setAttribute('aria-label', right ? fill(C.youSaidRight, { place:ordinal(said) }) : fill(C.youSaidWrong, { place:ordinal(said), real:ordinal(real) }));
    var you = el('div', 'cmp-side'); you.appendChild(el('span', 'cmp-lbl', C.cmpYou)); you.appendChild(numeral(said + 1, right ? '' : 'ghost')); w.appendChild(you);
    w.appendChild(html('span', 'cmp-arrow', ICON_ARROW));
    var re = el('div', 'cmp-side'); re.appendChild(el('span', 'cmp-lbl', C.cmpReal)); re.appendChild(medal(real)); w.appendChild(re);
    var v = html('span', 'cmp-verdict', right ? ICON_OK : ICON_NO); v.appendChild(document.createTextNode(right ? C.logRight : C.logMissed)); w.appendChild(v);
    return w;
  }

  /* ---------- podium: real order, first place biggest, chip on each ---------- */
  function podium(round, order, ranks, compact){
    var w = el('div', 'podium' + (compact ? ' compact' : ''));
    order.forEach(function(id, i){
      /* Full podium reveals third first and the winner last; compact recaps read in order. */
      var col = el('div', 'pcol p' + (i + 1)); col.style.setProperty('--i', compact ? i : 2 - i);
      var seq = compact ? i : 2 - i;
      /* The comparison sits first, so the visitor reads what they said against the real place before the card. */
      var ch = chip(order, ranks, id); ch.style.setProperty('--i', seq); col.appendChild(ch);
      /* On phones the platforms are hidden, so the head carries the numeral there. */
      var head = el('div', 'phead'); head.appendChild(medal(i)); head.appendChild(el('span', 'plabel', cap(ordinal(i)))); col.appendChild(head);
      if (compact) {
        var t = el('div', 'tile'), m = measureOf(round, id);
        t.appendChild(el('div', 'name', nameOf(id)));
        t.appendChild(el('div', 'fig', m[0])); t.appendChild(el('div', 'cap', m[1]));
        col.appendChild(t);
      } else {
        if (i === 0) col.appendChild(el('div', 'spot'));
        col.appendChild(card(round, id, { stats:true }));
      }
      /* The podium step carries its own number and label. */
      var pf = el('div', 'platform'); pf.style.setProperty('--i', seq);
      pf.appendChild(medal(i)); pf.appendChild(el('span', 'pf-lbl', cap(ordinal(i))));
      col.appendChild(pf);
      w.appendChild(col);
    });
    return w;
  }

  /* ---------- screens ---------- */
  function header(eyebrow, title, lead){
    main.appendChild(el('p', 'eyebrow', eyebrow));
    main.appendChild(el('h1', null, title));
    if (lead) main.appendChild(el('p', 'lead', lead));
  }
  function progress(text){ $('progress').textContent = text || ''; }
  function bar(){
    var total = R.length * STEPS.length + 1, done;
    if (S.step === 'landing') done = 0;
    else if (S.step === 'result') done = total;
    else done = S.round * STEPS.length + STEPS.indexOf(S.step) + 1;
    $('barfill').style.width = (100 * done / total) + '%';
  }

  function landing(){
    progress('');
    header(C.eyebrow, C.title, C.lead);
    C.intro.forEach(function(t){ main.appendChild(el('p', null, t)); });
    main.appendChild(el('div', 'rule'));
    main.appendChild(el('p', 'notice', C.sample));
    var a = el('div', 'actions'); var b = el('button', 'btn', C.start); b.type = 'button';
    b.addEventListener('click', function(){ go('rank'); }); a.appendChild(b); main.appendChild(a);
  }

  function rank(){
    var r = R[S.round];
    if (!S.display[S.round]) S.display[S.round] = shuffle(r.blocks);
    var last = S.ranks[S.ranks.length - 1];
    var unpick = function(id){ var k = S.ranks.indexOf(id); if (k !== -1) { S.ranks.splice(k, 1); render(false); } };
    var onKey = function(fn){ return function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }; };
    progress(roundLabel() + ' · ' + C.rankStep);
    header(roundLabel() + ' · ' + C.rankStep, r.job, fill(C.rankLead, { measure:r.measure }));
    var ins = el('div', 'instr');
    ins.appendChild(numeral(S.ranks.length + 1 > 3 ? 3 : S.ranks.length + 1));
    var insText = el('span'); insText.appendChild(document.createTextNode(C.rankInstruction));
    if (S.ranks.length) insText.appendChild(el('span', 'sub', C.rankUndo));
    ins.appendChild(insText); main.appendChild(ins);
    var slots = el('div', 'slots');
    for (var i = 0; i < 3; i++) {
      var filled = !!S.ranks[i];
      var s = el(filled ? 'button' : 'div', 'slot' + (filled ? ' filled' : '') + (filled && S.ranks[i] === last ? ' fresh-slot' : ''));
      if (filled) { s.type = 'button'; s.setAttribute('aria-label', fill(C.slotRemove, { name:nameOf(S.ranks[i]), place:ordinal(i) })); s.addEventListener('click', (function(id){ return function(){ unpick(id); }; })(S.ranks[i])); }
      s.appendChild(numeral(i + 1, filled ? (S.ranks[i] === last ? 'fresh' : '') : 'ghost'));
      var t = el('div', 't'); t.appendChild(el('b', null, cap(ordinal(i)))); t.appendChild(el('span', null, filled ? nameOf(S.ranks[i]) : C.slotEmpty)); s.appendChild(t);
      slots.appendChild(s);
    }
    main.appendChild(slots);
    var g = el('div', 'grid');
    S.display[S.round].forEach(function(id, k){
      var pos = S.ranks.indexOf(id);
      var c = card(r, id, { pickable:pos === -1, picked:pos !== -1, place:pos === -1 ? undefined : pos, fresh:id === last });
      if (id === last) c.classList.add('fresh-card');
      c.style.setProperty('--i', k);
      if (pos === -1) {
        var choose = function(){ if (S.ranks.length < 3 && S.ranks.indexOf(id) === -1) { S.ranks.push(id); render(false); } };
        c.addEventListener('click', choose);
        c.addEventListener('keydown', onKey(choose));
      } else {
        c.setAttribute('role', 'button'); c.tabIndex = 0; c.setAttribute('aria-pressed', 'true');
        c.setAttribute('aria-label', fill(C.slotRemove, { name:nameOf(id), place:ordinal(pos) }));
        var drop = function(){ unpick(id); };
        c.addEventListener('click', drop);
        c.addEventListener('keydown', onKey(drop));
      }
      g.appendChild(c);
    });
    main.appendChild(g);
    main.appendChild(el('p', 'small', C.measureNote)).style.marginTop = '1rem';
    var a = el('div', 'actions');
    var lock = el('button', 'btn', C.lock); lock.type = 'button'; lock.disabled = S.ranks.length < 3;
    lock.addEventListener('click', function(){ if (S.ranks.length === 3) go('reveal'); });
    var reset = el('button', 'btn ghost', C.reset); reset.type = 'button';
    reset.addEventListener('click', function(){ S.ranks = []; render(false); });
    a.appendChild(lock); a.appendChild(reset); main.appendChild(a);
  }

  function reveal(){
    var r = R[S.round], order = trueOrder(r), winner = order[0];
    var got = S.ranks[0] === winner;
    if (S.log.length === S.round) { S.log.push({ round:S.round, winner:winner, gotWinner:got, gotWhy:null, ranks:S.ranks.slice() }); if (got) award(); else miss(); }
    progress(roundLabel() + ' · ' + C.revealStep);
    header(roundLabel() + ' · ' + C.revealStep, r.job, null);
    var pickPlace = order.indexOf(S.ranks[0]);
    main.appendChild(el('p', 'verdict', got ? C.calledWinner : fill(C.missedWinner, { pick:nameOf(S.ranks[0]), place:ordinal(pickPlace) })));
    main.appendChild(podium(r, order, S.ranks, false));
    main.appendChild(el('p', 'small', C.measureNote)).style.marginTop = '1rem';
    var a = el('div', 'actions'); var b = el('button', 'btn', C.whyStep); b.type = 'button';
    b.addEventListener('click', function(){ go('why'); }); a.appendChild(b); main.appendChild(a);
    Array.prototype.forEach.call(main.querySelectorAll('.podium .stat.measure .fig'), function(f, i){ countUp(f, 500 + i * 110); });
  }

  function why(){
    var r = R[S.round], winner = trueOrder(r)[0];
    if (!S.optOrder[S.round]) S.optOrder[S.round] = shuffle(r.why.options.map(function(_, i){ return i; }));
    progress(roundLabel() + ' · ' + C.whyStep);
    header(roundLabel() + ' · ' + C.whyStep, r.why.question, fill(C.whyLead, { winner:nameOf(winner) }));
    var o = el('div', 'opts');
    S.optOrder[S.round].forEach(function(idx, k){
      var opt = r.why.options[idx];
      var b = el('button', 'opt'); b.type = 'button'; b.setAttribute('aria-pressed', S.whyPick === idx ? 'true' : 'false'); b.style.setProperty('--i', k);
      b.appendChild(numeral(String.fromCharCode(65 + k), 'k'));
      b.appendChild(el('span', null, opt.text));
      b.addEventListener('click', function(){ S.whyPick = (S.whyPick === idx) ? null : idx; render(false); });
      o.appendChild(b);
    });
    main.appendChild(o);
    var a = el('div', 'actions'); var lock = el('button', 'btn', C.choose); lock.type = 'button'; lock.disabled = S.whyPick === null;
    lock.addEventListener('click', function(){ if (S.whyPick !== null) go('whyreveal'); }); a.appendChild(lock); main.appendChild(a);
  }

  function whyreveal(){
    var r = R[S.round], order = trueOrder(r), winner = order[0], pick = r.why.options[S.whyPick], right = pick.block === winner;
    if (S.log[S.round].gotWhy === null) { S.log[S.round].gotWhy = right; S.log[S.round].whyPick = S.whyPick; if (right) award(); else miss(); }
    progress(roundLabel() + ' · ' + C.whyRevealStep);
    header(roundLabel() + ' · ' + C.whyRevealStep, r.job, null);
    main.appendChild(el('p', 'verdict', right ? fill(C.whyRight, { winner:nameOf(winner) }) : fill(C.whyWrong, { other:nameOf(pick.block), winner:nameOf(winner) })));
    main.appendChild(el('h2', null, C.realOrder));
    main.appendChild(podium(r, order, S.ranks, true));
    main.appendChild(el('h2', null, r.why.question));
    var o = el('div', 'opts');
    S.optOrder[S.round].forEach(function(idx, k){
      var opt = r.why.options[idx], isWin = opt.block === winner, mine = idx === S.whyPick;
      var b = el('div', 'opt' + (isWin ? ' win' : '')); b.style.setProperty('--i', k);
      b.appendChild(numeral(String.fromCharCode(65 + k), 'k'));
      var t = el('span'); t.appendChild(document.createTextNode(opt.text));
      var of = el('span', 'of');
      of.appendChild(el('span', 'chip', fill(C.optionTrueOf, { name:nameOf(opt.block) })));
      if (isWin) of.appendChild(el('span', 'chip ok', C.winnerFact));
      if (mine) of.appendChild(el('span', 'chip ' + (right ? 'ok' : 'no'), C.yourAnswer));
      t.appendChild(of); b.appendChild(t); o.appendChild(b);
    });
    main.appendChild(o);
    var src = el('div', 'panel'); src.appendChild(el('p', 'lbl', C.sourceLabel));
    src.appendChild(html('p', null, B[winner].note)); main.appendChild(src);
    var tk = el('div', 'panel'); tk.appendChild(el('p', 'lbl', C.takeawayLabel));
    tk.appendChild(el('p', null, r.takeaway)); tk.appendChild(el('div', 'approval', C.approval)); main.appendChild(tk);
    var a = el('div', 'actions'); var last = S.round === R.length - 1;
    var b = el('button', 'btn', last ? C.seeResult : fill(C.nextRound, { n:S.round + 2 })); b.type = 'button';
    b.addEventListener('click', function(){ if (last) { go('result'); } else { S.round += 1; S.ranks = []; S.whyPick = null; go('rank'); } });
    a.appendChild(b); main.appendChild(a);
  }

  function result(){
    progress(C.resultStep);
    main.appendChild(el('p', 'eyebrow', C.resultStep));
    var parts = C.resultHeading.split('{n}'), h = el('h1');
    h.appendChild(document.createTextNode(parts[0])); var n = el('span', 'count', String(S.score)); h.appendChild(n); h.appendChild(document.createTextNode(parts[1] || ''));
    main.appendChild(h);
    var tier = el('div', 'tier'); tier.appendChild(medal(S.score >= 6 ? 0 : S.score >= C.highFrom ? 1 : 2)); tier.appendChild(el('span', null, tierOf(S.score).name)); main.appendChild(tier);
    main.appendChild(el('p', 'lead', C.resultSub));
    main.appendChild(el('p', 'verdict', S.score >= C.highFrom ? C.resultHigh : C.resultLow));
    S.log.forEach(function(L){
      var r = R[L.round], order = trueOrder(r);
      var blk = el('div', 'roundblock');
      blk.appendChild(el('p', 'eyebrow', fill(C.roundLabel, { n:L.round + 1, total:R.length })));
      blk.appendChild(el('h2', null, r.job));
      blk.appendChild(podium(r, order, L.ranks, true));
      var re = el('div', 'reason'); re.appendChild(el('b', null, C.reasonRow + ':'));
      re.appendChild(el('span', 'chip ' + (L.gotWhy ? 'ok' : 'no'), L.gotWhy ? C.logRight : C.logMissed));
      re.appendChild(el('span', null, r.why.options.filter(function(o){ return o.block === L.winner; })[0].text));
      blk.appendChild(re);
      main.appendChild(blk);
    });
    var cta = el('div', 'cta');
    cta.appendChild(el('p', 'eyebrow', C.brand));
    cta.appendChild(el('h2', null, C.cta.heading));
    cta.appendChild(el('p', null, C.cta.copy));
    /* Booking destination is configuration. Confirm the live link before release. */
    var a = el('a', 'btn', C.cta.button); a.href = C.cta.url; a.target = '_blank'; a.rel = 'noopener'; cta.appendChild(a);
    main.appendChild(cta);
    var acts = el('div', 'actions');
    var share = el('button', 'btn ghost', C.share); share.type = 'button';
    share.addEventListener('click', function(){
      var url = location.href.split('#')[0];
      var done = function(){ share.textContent = C.shared; setTimeout(function(){ share.textContent = C.share; }, 1800); };
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(done, function(){ window.prompt(C.share, url); }); } else { window.prompt(C.share, url); }
    });
    var print = el('button', 'btn ghost', C.print); print.type = 'button'; print.addEventListener('click', function(){ window.print(); });
    var over = el('button', 'btn ghost', C.startOver); over.type = 'button';
    over.addEventListener('click', function(){ S = { step:'landing', round:0, ranks:[], display:{}, optOrder:{}, whyPick:null, score:0, streak:0, log:[] }; go('landing'); });
    acts.appendChild(share); acts.appendChild(print); acts.appendChild(over); main.appendChild(acts);
    countUp(n, 400);
    if (S.score >= C.highFrom) setTimeout(confetti, 600);
  }

  /* ---------- router ---------- */
  var screens = { landing:landing, rank:rank, reveal:reveal, why:why, whyreveal:whyreveal, result:result };
  /* animate=true plays the entrance motion (screen changes); false re-renders in place (a pick, an undo). */
  function render(animate){
    main.innerHTML = '';
    main.classList.toggle('anim', animate !== false);
    screens[S.step]();
    Array.prototype.forEach.call(main.children, function(c, i){ c.style.setProperty('--i', i); });
    bar(); hud();
  }
  function go(step){
    if (reduced) { S.step = step; render(true); focusTitle(); return; }
    main.classList.add('leave');
    setTimeout(function(){ S.step = step; main.classList.remove('leave'); render(true); focusTitle(); }, 170);
  }

  $('brand').textContent = C.brand;
  $('foot').innerHTML = C.brand + ' · <a href="https://talexmedia.com">talexmedia.com</a> · <a href="mailto:info@talexmedia.com">info@talexmedia.com</a>';
  render(true);

  /* read-only hook so the arithmetic can be checked from the console */
  window.__caseStudy = { state:function(){ return JSON.parse(JSON.stringify(S)); }, order:function(i){ return trueOrder(R[i]); }, nameOf:nameOf, go:go };
})();
</script>
